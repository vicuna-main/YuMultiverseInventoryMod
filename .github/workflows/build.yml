name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew build --dependency-verification strict --warning-mode all
      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat build --dependency-verification strict --warning-mode all

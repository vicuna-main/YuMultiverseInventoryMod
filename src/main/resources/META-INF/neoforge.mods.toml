modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
authors="Yu"
description='''
Server-authoritative, share-based player inventory isolation for NeoForge and
NeoForge/Bukkit hybrid servers. Supports exact, wildcard, and regular-expression
world groups with transactional per-share profiles. Includes full Curios,
Cosmetic Armor Reworked, and TrashSlot isolation through soft-loaded adapters.
'''

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[21.1.235,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
type="optional"
versionRange="[9.5.1,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="cosmeticarmorreworked"
type="optional"
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="trashslot"
type="optional"
versionRange="[21.1.11,)"
ordering="AFTER"
side="BOTH"
